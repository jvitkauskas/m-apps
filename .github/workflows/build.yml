# SPDX-License-Identifier: MIT
name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up the pi32v2 LLVM toolchain (checks the release's SHA256SUMS)
        id: toolchain
        uses: jvitkauskas/pi32v2-isa/.github/actions/setup-pi32v2@66ac37bb2ae40e5dbbd5588a6a7c2d7baf829d7f
        with:
          version: pi32v2-23.1.5-2
      - name: Point the build at the toolchain
        shell: bash
        run: echo "TOOLCHAIN=${{ steps.toolchain.outputs.path }}" >> "$GITHUB_ENV"
      - name: Build every app for both boards
        run: make -j2
      - name: Tests
        run: make test
      - name: The release's tars
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: m-apps-${{ github.sha }}
          if-no-files-found: error
          path: build/release/

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m-apps-${{ github.sha }}
          path: release
      - name: Publish the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber release/*
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "m-apps $RELEASE_TAG" release/*
          fi
